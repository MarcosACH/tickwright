[project]
name = "tickwright"
version = "0.1.0"
description = "An event-driven algorithmic trading engine built as a readable reference implementation."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "Marcos Achaval" }]
# Runtime dependencies are intentionally empty at scaffold time. Each vertical
# slice adds exactly the deps it needs (ADR-0021), so the default paper-exchange
# + in-memory-bus path stays hermetic: `uv sync` pulls nothing off the network
# beyond the dev toolchain below.
dependencies = [
    "aiohttp>=3.14.1",
    "aiokafka>=0.14.0",
    "hyperliquid-python-sdk~=0.24",
    "msgspec>=0.21.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "websockets>=15.0",
]

[project.scripts]
tickwright = "tickwright.app.__main__:main"

[dependency-groups]
# Installed by `uv sync --dev` (and in CI). Not shipped to consumers.
dev = [
    "ruff>=0.15.22",
    "mypy>=2.2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.156.6",
    "import-linter>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickwright"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E501 (line length) is handled by the formatter; F403 (star imports) is
# permitted where a package re-exports its public surface.
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "F403"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]
# `src` maps to the `tickwright` package; `tests/_support` holds top-level test
# helpers (kafka_fakes, store_backends). With explicit_package_bases on, both
# must be declared bases so files under them keep their intended module names.
mypy_path = ["src", "tests/_support"]
# The test tree is a flat namespace (no __init__.py; pythonpath discovery), so
# per-area `conftest.py` files share a module name. These let mypy path-qualify
# them instead of erroring on the collision.
namespace_packages = true
explicit_package_bases = true

# aiokafka ships no py.typed marker; the bus wraps it behind its own typed
# Protocols (_ProducerLike/_ConsumerLike), so the untyped surface never leaks.
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

# hyperliquid-python-sdk ships no py.typed marker; only its signing utilities
# are used (ADR-0021), behind the adapter's own typed surface.
[[tool.mypy.overrides]]
module = "hyperliquid.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Process-boundary fakes shared across suites (e.g. the Kafka broker) live in
# tests/_support and import as plain top-level modules: `import kafka_fakes`.
pythonpath = ["tests/_support"]
# A leaked resource (e.g. an unclosed store connection) is a bug, not noise:
# fail the suite so it can never accumulate silently and mask a real warning.
filterwarnings = ["error::ResourceWarning"]
# `postgres` marks tests that need a real Postgres (the PostgresStore contract
# arm, ADR-0019). They auto-skip when no STORE_POSTGRES_DSN is reachable, so the
# default `uv run pytest` stays hermetic; `-m "not postgres"` deselects them.
markers = [
    "postgres: needs a reachable Postgres server (auto-skips without STORE_POSTGRES_DSN)",
    "live: places real orders on Hyperliquid testnet (auto-skips without the TICKWRIGHT_LIVE_TESTNET opt-in; run manually/nightly, never in the CI gate, ADR-0022)",
]

[tool.coverage.run]
source = ["src/tickwright"]
branch = true

[tool.coverage.report]
show_missing = true

# Import boundaries for the ports-and-adapters topology (ADR-0032, module map
# docs/module-maps/v1-core-engine.md). CI runs `uv run lint-imports`; a
# cross-adapter or core->adapter import fails the build, so "decoupled" is a
# gate, not an aspiration. Dependency direction is inward:
#   app -> engine, adapters/*, venues/*, strategies, domain, observability
#   engine -> domain, observability            (Protocols only, never a concrete)
#   adapters/{bus,store,feed,paper}, venues/* -> domain, observability
#   adapters/clock, strategies -> domain        (leaf-pure: emit no named events)
#   domain -> (nothing) ; observability -> (nothing inward)
[tool.importlinter]
root_package = "tickwright"
# Lets contracts name external packages (msgspec/aiokafka in the serde gate).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain depends on nothing internal"
type = "forbidden"
source_modules = ["tickwright.domain"]
forbidden_modules = [
    "tickwright.engine",
    "tickwright.adapters",
    "tickwright.venues",
    "tickwright.strategies",
    "tickwright.observability",
    "tickwright.app",
]

[[tool.importlinter.contracts]]
name = "engine never imports a concrete impl"
type = "forbidden"
source_modules = ["tickwright.engine"]
forbidden_modules = [
    "tickwright.adapters",
    "tickwright.venues",
    "tickwright.strategies",
    "tickwright.app",
]

[[tool.importlinter.contracts]]
name = "adapters, venues, and strategies never import inward-forbidden layers"
type = "forbidden"
source_modules = [
    "tickwright.adapters",
    "tickwright.venues",
    "tickwright.strategies",
]
forbidden_modules = [
    "tickwright.engine",
    "tickwright.app",
]

# ADR-0032 makes observability a shared leaf that engine and adapters *may*
# import — a ceiling, not a floor. The clock and strategies stay below it: they
# emit no named events (ADR-0020's catalog has none; a strategy's telemetry is
# emitted by the runner's containment wrapper, not the strategy itself), so the
# module map draws them domain-only. This contract makes that drawn edge a gate.
[[tool.importlinter.contracts]]
name = "clock and strategies stay domain-only (never import observability)"
type = "forbidden"
source_modules = [
    "tickwright.adapters.clock",
    "tickwright.strategies",
]
forbidden_modules = ["tickwright.observability"]

[[tool.importlinter.contracts]]
name = "observability is a leaf and imports nothing inward"
type = "forbidden"
source_modules = ["tickwright.observability"]
forbidden_modules = [
    "tickwright.domain",
    "tickwright.engine",
    "tickwright.adapters",
    "tickwright.venues",
    "tickwright.strategies",
    "tickwright.app",
]

# ADR-0025: serialization is a KafkaBus boundary concern. Domain events stay
# stdlib dataclasses and the in-memory hot path passes them by reference —
# neither may touch the wire stack. (The package __init__ is not addressable
# here; the runtime probe in test_inmemory_bus.py gates what it loads.)
[[tool.importlinter.contracts]]
name = "domain and the in-memory bus hot path stay serde/Kafka-free"
type = "forbidden"
source_modules = [
    "tickwright.domain",
    "tickwright.adapters.bus.inmemory",
    "tickwright.adapters.bus.config",
]
forbidden_modules = [
    "tickwright.adapters.bus.kafka",
    "tickwright.adapters.bus.serde",
    "msgspec",
    "aiokafka",
]

[[tool.importlinter.contracts]]
name = "no adapter imports another adapter, venue, or strategy package"
type = "independence"
modules = [
    "tickwright.adapters.bus",
    "tickwright.adapters.store",
    "tickwright.adapters.feed",
    "tickwright.adapters.paper",
    "tickwright.adapters.clock",
    "tickwright.venues.hyperliquid",
    "tickwright.strategies",
]

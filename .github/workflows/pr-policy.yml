# Enforces the PR invariants that docs/agents/issue-tracker.md and
# docs/workflow/labels.md define as convention: exactly one ralph:* state
# label on every open PR, an issue-closing reference in the body, and
# Conventional Commit subjects (CONTRIBUTING.md types). Label and body edits
# re-trigger evaluation, so a red check turns green without a new push.
#
# Dependabot exemption: the ralph:* label and closes-issue gates are for
# ralph/human PRs — a bot can apply neither, so those two steps are skipped for
# dependabot[bot] (the job still runs and reports success). The exemption keys
# off the PR author (github.event.pull_request.user.login), not github.actor —
# a human editing/labeling a dependabot PR re-triggers this workflow as
# themselves, and github.actor would then reflect the human, not the bot,
# wrongly un-exempting the PR. conventional-commits is NOT exempt: Dependabot's
# ci:/chore: subjects already conform and stay gated.
#
# Intended to become a required status check on main (both job names) once it
# has reported at least once — same phasing as `ci`.
name: pr-policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  # The label step re-reads the PR rather than trusting the event payload; see the
  # comment on it for why.
  pull-requests: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one ralph:* state label
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Read the labels from the API, not from the event payload. `gh pr create
          # --label` is not atomic: GitHub creates the PR, fires `opened`, and attaches
          # the label after — so the payload this job started from reports zero on a PR
          # that carries one, and the red check survives the `labeled` re-run that passes.
          #
          # Retry only while the count is zero, which is the only value the race can
          # produce. Two labels is a real error and fails on the first read; a genuinely
          # unlabelled PR pays ten seconds once to reach the same verdict.
          n=0
          for _ in 1 2 3 4 5; do
            n=$(gh api "repos/$REPO/pulls/$PR" \
                  --jq '[.labels[].name | select(startswith("ralph:"))] | length')
            if [ "$n" -ne 0 ]; then
              break
            fi
            sleep 2
          done
          if [ "$n" -ne 1 ]; then
            echo "::error::PR carries $n 'ralph:*' state labels; exactly one is required" \
                 "(see docs/workflow/labels.md — PR state machine)."
            exit 1
          fi

      - name: Body closes an issue
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY"; then
            echo "::error::PR body must reference the issue it closes ('Closes #<N>')." \
                 "Merging is what closes issues — see CONTRIBUTING.md."
            exit 1
          fi

  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit subjects follow Conventional Commits
        # Types are the CONTRIBUTING.md set. Merge commits (branch updates from
        # main) are exempt; everything else that would land on main is checked.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}
            subject=${line#* }
            if ! grep -qE '^(feat|fix|docs|refactor|test|chore|ci)(\([a-z0-9._/-]+\))?!?: .+' <<<"$subject"; then
              echo "::error::Commit ${sha:0:7} is not a Conventional Commit: \"$subject\"" \
                   "(types: feat|fix|docs|refactor|test|chore|ci — see CONTRIBUTING.md)."
              bad=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD")
          exit "$bad"

# Authoritative gate on every PR and push to main: format-check, lint, type-check
# and test. The .githooks/ pre-commit and pre-push hooks are local convenience
# only — this workflow re-runs everything and `git commit/push --no-verify`
# cannot skip it once "main" branch protection requires the `ci` check.
#
# The default paper-exchange + in-memory-bus path needs no external services and
# no API keys, so this job starts none. (A Kafka-bus job can be added as a
# separate matrix leg if/when those tests need a broker.)
#
# Actions are pinned by commit SHA (supply-chain hardening); the trailing
# comment records the human-readable version. Bump both together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Check quality
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run python -m compileall -q src

      - name: Test
        # Coverage source is set in pyproject.toml ([tool.coverage.run] source);
        # the ≥90%-on-core gate lives here so a drop fails the build.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Suite is hermetic against ambient config
        # The tests above pass on a fresh runner by luck, not by design: .env is
        # gitignored and nothing here exports TICKWRIGHT_*, so the class defaults
        # win because both higher-priority sources happen to be empty. A job-level
        # env: block, a `cp .env.example .env` step, a repo variable, or a
        # self-hosted runner with a populated profile would each silently wire a
        # live venue into the paper tests (issue #71). This step removes the luck.
        #
        # The hostile env must be a *valid* config — hence SYMBOLS and SIGNING_KEY.
        # FEED+EXCHANGE alone is a config that fails validation loudly, and a guard
        # that only ever sees the invalid path would keep passing if the classes
        # stopped validating but kept reading ambient state. The danger is a
        # hostile config that is *accepted*. The dummy key need not be well-formed:
        # nothing in tests/app reads the environment now, and the one subprocess is
        # handed a scrubbed one.
        #
        # Scoped to tests/app on purpose — do not widen to the whole suite. The
        # live testnet suite (ADR-0022) skips on SIGNING_KEY being *absent*, not on
        # it being well-formed, so the dummy key above reads to it as a funded
        # wallet: it would be collected and fail. tests/app is where the env-reading
        # config class lives and is the whole blast radius of issue #71.
        env:
          TICKWRIGHT_FEED: hyperliquid
          TICKWRIGHT_EXCHANGE: hyperliquid
          TICKWRIGHT_HYPERLIQUID__SYMBOLS: '["BTC"]'
          TICKWRIGHT_HYPERLIQUID__SIGNING_KEY: "0xdeadbeef"
        run: uv run pytest tests/app -q

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv tool run pip-audit --requirement /tmp/requirements.txt

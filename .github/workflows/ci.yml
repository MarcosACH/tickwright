# Authoritative gate on every PR and push to main: format-check, lint, type-check
# and test. The .githooks/ pre-commit and pre-push hooks are local convenience
# only — this workflow re-runs everything and `git commit/push --no-verify`
# cannot skip it once "main" branch protection requires the `ci` check.
#
# The default paper-exchange + in-memory-bus path needs no external services and
# no API keys. One service runs anyway: Postgres, because ADR-0019's parity
# promise — swapping the store changes durability, never behavior — is asserted
# by the store contract's `postgres` arm, and that arm auto-skips without a DSN.
# On a runner it therefore never ran at all (28 tests, issue #253). It is cheap
# (~1s) and hermetic, so it belongs in the gate. The Kafka path needs no broker:
# ADR-0022 fakes that client at the process boundary.
#
# The non-hermetic `live` suite (ADR-0022) stays out — a real venue in the gate
# would make red stop meaning "you broke something". It runs on a schedule.
#
# Anything added here stays inside the single `ci` job: the required status
# check in ruleset `protect-main` is the literal context `ci`, and a matrix
# would rename it (`ci (sqlite)`, `ci (postgres)`) so that context never
# reports and every PR blocks forever.
#
# Actions are pinned by commit SHA (supply-chain hardening); the trailing
# comment records the human-readable version. Bump both together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Mirrors the `postgres` service in docker-compose.yml — same image tag and
    # same credentials, so CI and local dev exercise one server, not two. The
    # runner blocks on the health check before the first step runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tickwright
          POSTGRES_PASSWORD: tickwright
          POSTGRES_DB: tickwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickwright -d tickwright"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Check quality
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run python -m compileall -q src

      - name: Test
        # Coverage source is set in pyproject.toml ([tool.coverage.run] source);
        # the ≥90%-on-core gate lives here so a drop fails the build.
        #
        # STORE_POSTGRES_DSN addresses the service above, which enrols the store
        # contract's `postgres` arm (ADR-0019). It is deliberately set on this
        # step only, not on the hermeticity re-run below: that step exists to
        # prove TICKWRIGHT_* precedence, and a second Postgres pass proves
        # nothing it does not already. A bare `uv run pytest` with no DSN still
        # auto-skips the arm, so the local zero-setup default is unchanged.
        env:
          STORE_POSTGRES_DSN: postgresql://tickwright:tickwright@localhost:5432/tickwright
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Suite is hermetic against ambient config
        # A fresh runner exports no TICKWRIGHT_*, so the run above proves nothing
        # about the suite ignoring them (issue #71). Export a live venue and
        # re-run the whole suite: the paper defaults must still win.
        #
        # The env is deliberately *valid* — hence SYMBOLS/SIGNING_KEY. FEED+EXCHANGE
        # alone fails validation, and a guard that only sees the rejected path would
        # keep passing if the config stopped validating but kept reading ambient
        # state. The bug is a hostile config silently accepted.
        #
        # The live suite (ADR-0022) stays skipped because its run-gate is the
        # separate TICKWRIGHT_LIVE_TESTNET opt-in (issue #73), left unset here —
        # the dummy SIGNING_KEY no longer enrols it.
        env:
          TICKWRIGHT_FEED: hyperliquid
          TICKWRIGHT_EXCHANGE: hyperliquid
          TICKWRIGHT_HYPERLIQUID__SYMBOLS: '["BTC"]'
          TICKWRIGHT_HYPERLIQUID__SIGNING_KEY: "0xdeadbeef"
        run: uv run pytest -q

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv tool run pip-audit --requirement /tmp/requirements.txt

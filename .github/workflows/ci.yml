# Authoritative gate on every PR and push to main: format-check, lint, type-check
# and test. The .githooks/ pre-commit and pre-push hooks are local convenience
# only — this workflow re-runs everything and `git commit/push --no-verify`
# cannot skip it once "main" branch protection requires the `ci` check.
#
# The default paper-exchange + in-memory-bus path needs no external services and
# no API keys, so this job starts none. (A Kafka-bus job can be added as a
# separate matrix leg if/when those tests need a broker.)
#
# Actions are pinned by commit SHA (supply-chain hardening); the trailing
# comment records the human-readable version. Bump both together.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Check quality
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run python -m compileall -q src

      - name: Test
        # Coverage source is set in pyproject.toml ([tool.coverage.run] source);
        # the ≥90%-on-core gate lives here so a drop fails the build.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Suite is hermetic against ambient config
        # A fresh runner exports no TICKWRIGHT_*, so the run above proves nothing
        # about tests/app ignoring them (issue #71). Export a live venue and re-run:
        # the paper defaults must still win.
        #
        # The env is deliberately *valid* — hence SYMBOLS/SIGNING_KEY. FEED+EXCHANGE
        # alone fails validation, and a guard that only sees the rejected path would
        # keep passing if the config stopped validating but kept reading ambient
        # state. The bug is a hostile config silently accepted.
        #
        # Do not widen past tests/app: the live suite (ADR-0022) skips on
        # SIGNING_KEY being absent, so the dummy key below enrols it for real.
        env:
          TICKWRIGHT_FEED: hyperliquid
          TICKWRIGHT_EXCHANGE: hyperliquid
          TICKWRIGHT_HYPERLIQUID__SYMBOLS: '["BTC"]'
          TICKWRIGHT_HYPERLIQUID__SIGNING_KEY: "0xdeadbeef"
        run: uv run pytest tests/app -q

      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv tool run pip-audit --requirement /tmp/requirements.txt

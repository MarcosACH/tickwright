# Dependabot version updates. Security alerts / security-update PRs are a
# separate repo setting (enabled) and need no config here.
#
# ci.yml pins actions by commit SHA; the github-actions ecosystem below is what
# keeps those pins fresh (Dependabot updates the SHA and the version comment
# together). Every Dependabot PR goes through the normal CI + review gate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # The Dockerfile pins its base images by digest. This keeps those pins fresh.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # ADR-0021 keeps the image on 3.13, the lowest Python we support. A newer
    # minor would ship on a version CI may not test. Digest updates still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

schema_version: "1.0"
name: tdd-resumes-from-plan
description: >
  A session resumed on an issue that already has a plan reads that plan before
  exploring source or docs, and reconciles it against the log rather than
  trusting it.
tags: [tdd, skills, context-budget]

plugins:
  - .claude/skills/tdd

context:
  # Carries `.agents/plans/issue-900.md` with behavior 1 already ticked with a
  # sha and behaviors 2-4 open, plus the source and module map a from-scratch
  # exploration would reach for. The plan path is gitignored at the repo root
  # only (the pattern has an interior slash, so it is root-anchored), which is
  # why this fixture copy is committed.
  add_dirs: [fixture]

execution:
  # No mention of a plan file: finding it is the behavior under test. The
  # without-arm has the same tree and will typically start by reading source.
  prompt: |
    Picking issue #900 back up — the leverage bound slice. Where did we get to,
    and what's next?
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Grep, Glob, Bash]

runs: 2

graders:
  - name: tdd-skill-fired
    type: tool_used
    tool: Skill
    input_match: tdd
    arm: with-only

  # The claim: the plan is consulted *before any exploration*. Keyed on `Read`
  # on both sides — an agent that `cat`s the plan through Bash instead would
  # fail this grader despite complying, which is a known sharp edge of the
  # case rather than of the skill. Retune to a Bash-side match if the first
  # run shows that shape.
  - name: plan-read-before-source
    type: tool_order
    before:
      tool: Read
      input_match: .agents/plans/issue-900.md
    after:
      tool: Read
      input_match: src/domain/leverage.py

  # Confirm, don't trust: the recorded shas are checked against the log before
  # anything resumes. Weighted down — the ordering above is the core claim.
  - name: plan-reconciled-against-log
    type: tool_used
    tool: Bash
    input_match: git log
    min: 1
    weight: 0.5

  # The resume point is stated back and confirmation asked for, rather than the
  # agent silently continuing from a possibly stale file.
  - name: resume-point-stated-and-confirmed
    type: llm
    criteria: >
      The response states where the work stopped (behavior 1 done, behavior 2
      next, or equivalent, sourced from the plan file rather than guessed) and
      asks the user to confirm before continuing. Silently starting behavior 2
      does not pass; a generic "shall I proceed?" that does not name the resume
      point does not pass.
    focus: last_message
